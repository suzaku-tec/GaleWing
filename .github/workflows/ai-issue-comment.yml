name: Issue Analysis with Gemini
on:
  issues:
    types: [ opened, reopened ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Issue Triage
        # 公式のGemini Actionを使用（Google公式ツール）
        uses: google-github-actions/run-gemini-cli@v0
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 実行したい指示（プロンプト）をここに書く
          prompt: |
            以下のGitHub Issueの内容を分析してください。
            1. 要約（3行以内）
            2. 期待される解決策の提案
            3. 緊急度（高・中・低）の判定
            
            Issueタイトル: ${{ github.event.issue.title }}
            Issue本文:
            ${{ github.event.issue.body }}