name: AI Issue Assistant

on:
  issues:
    types: [ opened, reopened ]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Call Gemini API directly
        id: gemini-direct
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "'"${{ github.event.issue.title }}"\n\n${{ github.event.issue.body }}'"
                }]
              }],
              "generationConfig": {
                "temperature": 0.7,
                "maxOutputTokens": 2048
              }
            }')
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Error"')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
