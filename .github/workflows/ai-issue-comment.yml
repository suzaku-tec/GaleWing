name: AI Issue Assistant

on:
  issues:
    types: [ opened, reopened ]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini AI Analysis
        id: gemini
        run: |
          # APIを直接叩いて結果を環境変数に保存する
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{"text": "あなたは優秀なエンジニアです。以下のGitHub Issueを分析し、解決のためのヒントを日本語で回答してください。構成は「概要」「実装のヒント」「考慮すべき点」としてください。\n\nTitle: ${{ github.event.issue.title }}\nBody: ${{ github.event.issue.body }}"}]
              }]
            }')
          
          # 結果をパースしてGitHubの環境変数に書き込む
          echo "AI_COMMENT=$(echo $RESPONSE | jq -r '.candidates[0].content.parts[0].text')" >> $GITHUB_ENV

      - name: Post Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🤖 AIアシスタントによる分析
            ${{ env.AI_COMMENT }}