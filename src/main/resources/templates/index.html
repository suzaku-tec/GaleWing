<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/workspace.js}"></script>
    <link rel="stylesheet" th:href="@{/workspace.css}">
    <link rel="stylesheet" th:href="@{/menu.css}">
    <link rel="stylesheet" th:href="@{/common.css}">
    <link rel="stylesheet" th:href="@{/sidebar.css}">
    <link rel="stylesheet" th:href="@{/accordion.css}">
    <link rel="stylesheet" th:href="@{/rss.css}">
    <title>GaleWing</title>
</head>
<body>

<!-- ワークスペース -->
<nav class="workspace" id="workspace">
    <button class="toggle-btn" id="toggleBtn">
        <i class="fa-solid fa-bars"></i>
    </button>
    <ul class="menu-list">
        <li class="menu-item">
            <a href="/">
                <span class="icon">
                    <i class="fa-solid fa-rss"></i>
                </span>
                <span class="menu-text">RSSリーダー</span>
            </a>
        </li>
        <li class="menu-item">
            <a href="#">
                <span class="icon">
                    <i class="fa-solid fa-chart-simple"></i>
                </span>
                <span class="menu-text">統計</span>
            </a>
        </li>
        <li class="menu-item">
            <a href="#">
                <span class="icon">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </span>
                <span class="menu-text">便利ツール</span>
            </a>
        </li>
        <li class="menu-item">
            <a href="/settings">
                <span class="icon"><i class="fa-solid fa-gear"></i></span>
                <span class="menu-text">設定</span>
            </a>
        </li>
    </ul>
</nav>

<!-- メインコンテンツ -->
<main class="main-content container-fluid px-0 overflow-hidden">

    <div class="row g-0 p-0">
        <input type="hidden" id="identifier" value="" th:value="${identifier}">

        <!-- サイトバーメニュー -->
        <nav class="sidebar col-md-3" id="sidemenu">
            <section>

                <!-- サイドメニュー(View List) -->
                <input id="view-block" type="checkbox" class="toggle" checked/>
                <label class="Label" for="view-block">
                    <p class="h4 mb-0">
                        View Link
                    </p>
                </label>
                <div class="accordionContent">
                    <ul class="nav flex-column m-o p-3 bg-primary">
                        <li class="nav-item">
                            <div th:each="view: ${viewlist}" class="mb-1">
                                <th:block th:if="${view.id == identifier}">
                                    <a class="list-group-item bg-warning menu-link-item"
                                       th:href="@{/(uuid=${view.id})}">
                                        [[${view.title}]]
                                        <span th:id="${view.id} + '_count'" class="badge rounded-pill bg-info text-dark"
                                              th:text="${view.count}"></span></a>
                                </th:block>
                                <th:block th:if="${!(view.id == identifier)}">
                                    <a class="list-group-item menu-link-item" th:href="@{/(uuid=${view.id})}">
                                        [[${view.title}]]
                                        <span th:id="${view.id} + '_count'" class="badge rounded-pill bg-info text-dark"
                                              th:text="${view.count}"></span></a>
                                </th:block>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- Site List -->
                <input id="block-01" type="checkbox" value="" class="toggle"
                       th:checked="${!#strings.isEmpty(identifier)}"/>
                <label class="Label" for="block-01">
                    <p class="h4">
                        Site List
                    </p>
                </label>

                <div class="accordionContent">
                    <ul class="nav flex-column m-o p-3 bg-primary menu">
                        <li class="nav-item mb-2 menu">
                            <th:block th:if="${#strings.isEmpty(identifier)}">
                                <a href="/" class="list-group-item bg-warning">All</a>
                            </th:block>
                            <th:block th:if="${!#strings.isEmpty(identifier)}">
                                <a href="/" class="list-group-item">All</a>
                            </th:block>
                        </li>
                        <li class="mb-2 menu" id="siteList">
                            <div th:each="site: ${sitelist}">
                                <th:block th:if="${site.uuid == identifier && site.count > 0}">
                                    <a href="" class="list-group-item bg-warning menu-link-item" th:id="${site.uuid}"
                                       th:href="@{/(uuid=${site.uuid})}"> <img
                                            th:src="'data:image/png;base64,' + ${site.faviconBase64}" width="16"
                                            height="16" alt="アイコン">
                                        [[${site.title}]]：
                                        <span th:id="${site.uuid} + '_count'"
                                              class="badge rounded-pill bg-info text-dark">[[${site.count}]]</span></a>
                                </th:block>
                                <th:block th:if="${!(site.uuid == identifier) && site.count > 0}">
                                    <a href="" class="list-group-item menu-link-item" th:id="${site.uuid}"
                                       th:href="@{/(uuid=${site.uuid})}"> <img
                                            th:src="'data:image/png;base64,' + ${site.faviconBase64}" width="16"
                                            height="16" alt="アイコン">
                                        [[${site.title}]]：
                                        <span th:id="${site.uuid} + '_count'"
                                              class="badge rounded-pill bg-info text-dark">[[${site.count}]]</span></a>
                                </th:block>
                            </div>
                        </li>
                    </ul>
                </div>
            </section>
        </nav>

        <!-- メインコンテンツ -->
        <div class="col-md-9" id="mainContent">
            <div style="margin: 10px">
                <!-- カスタムヘッダー -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 5px 16px; background-color: #f8f9fa; border: 1px solid #babfc7; border-bottom: none;">
                    <div>
                        <label style="font-size: 14px;">
                            Page Size:
                            <input type="text" id="header-pageSize" size="3"/>
                        </label>
                    </div>

                    <div id="header-viewDataInfo"></div>

                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="header-firstBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="header-firstBtn-icon" class="fa-solid fa-angles-left" style="cursor: pointer;"></i>
                        </button>
                        <button id="header-prevBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="header-prevBtn-icon" class="fa-solid fa-chevron-left"
                               style="cursor: pointer;"></i>
                        </button>
                        Page <input type="text" id="header-nowPage" size="3" aria-label="現在ページ"/>
                        <span id="header-pageInfo" style="font-size: 14px; margin: 0 8px;"> of 1 ページ</span>
                        <button id="header-nextBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="header-nextBtn-icon" class="fa-solid fa-chevron-right"
                               style="cursor: pointer;"></i>
                        </button>
                        <button id="header-lastBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="header-lastBtn-icon" class="fa-solid fa-angles-right" style="cursor: pointer;"></i>
                        </button>
                    </div>
                </div>
                <div id="wrapper"></div>
                <!-- カスタムフッター -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 5px 16px; background-color: #f8f9fa; border: 1px solid #babfc7; border-top: none;">
                    <div>
                        <label style="font-size: 14px;">
                            Page Size:
                            <input type="text" id="footer-pageSize" size="3"/>
                        </label>
                    </div>

                    <div id="footer-viewDataInfo"></div>

                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="footer-firstBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="footer-firstBtn-icon" class="fa-solid fa-angles-left" style="cursor: pointer;"></i>
                        </button>
                        <button id="footer-prevBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="footer-prevBtn-icon" class="fa-solid fa-chevron-left"
                               style="cursor: pointer;"></i>
                        </button>
                        Page <input type="text" id="footer-nowPage" size="3" aria-label="現在ページ"/>
                        <span id="footer-pageInfo" style="font-size: 14px; margin: 0 8px;"> of 1 ページ</span>
                        <button id="footer-nextBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="footer-nextBtn-icon" class="fa-solid fa-chevron-right"
                               style="cursor: pointer;"></i>
                        </button>
                        <button id="footer-lastBtn" type="button" class="btn btn-outline-primary rounded">
                            <i id="footer-lastBtn-icon" class="fa-solid fa-angles-right" style="cursor: pointer;"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
