apply plugin: 'com.github.node-gradle.node'

apply from: 'init_task.gradle'

processResources.dependsOn npmRun

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

tasks.withType(JavaCompile).configureEach {
    // remove the if condition if you want to run NullAway on test code
    if (!name.toLowerCase().contains("test")) {
        options.errorprone {
            check("NullAway", CheckSeverity.WARN)
            option("NullAway:AnnotatedPackages", "com.uber")
        }
    }
}

nullaway {
    annotatedPackages.add("net.ltgt")
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // 全てのチェックを無効化する。開発時は切り替える
        // githubにコミットした場合のビルドで、チェックエラーになると困るので、nullawayでエラーが出なくなるまでは、これを残す or 切り替える
        disableAllChecks = true
    }

    options.errorprone.nullaway {
        error()
    }
}

tasks.register('createCustomRssSqliteDb', JavaExec) {
    mainClass.set('gradle.task.InitCustomRssSqliteDb')
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('testJavaSample', JavaExec) {
    mainClass.set('gradle.task.JsoupTest')
    classpath = sourceSets.main.runtimeClasspath
}
