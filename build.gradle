import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id "com.github.node-gradle.node" version "3.1.0"
    id "org.sonarqube" version "5.1.0.4882"
    id 'jacoco'

    // we assume you are already using the Java plugin
    id "net.ltgt.errorprone" version "4.0.0"
    id "net.ltgt.nullaway" version "2.0.0"
    id 'groovy'
}

apply plugin: 'io.spring.dependency-management'

allprojects {
    ext {
        springVersion = "3.5.4"
        nullAwayVersion = "0.11.0"
        errorProneVersion = "2.28.0"
        lucene_version = "8.11.4"
        springdocOpenApiVersion = "2.8.11"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
javadoc.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url 'https://jitpack.io' }
}

// tag::jar[]
jar {
    archiveBaseName = 'GaleWings'
    archiveVersion = '0.1.0'
}
// end::jar[]

configurations {
    groovyLib
    groovySqlLib
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-web:$springVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-test:$springVersion"

    implementation 'com.miragesql:miragesql:2.1.2'
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'

    // https://mvnrepository.com/artifact/be.ceau/opml-parser
    implementation 'be.ceau:opml-parser:3.1.0'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
    implementation 'org.apache.commons:commons-dbcp2:2.12.0'

    // https://mvnrepository.com/artifact/org.springframework/spring-jdbc
    implementation 'org.springframework:spring-jdbc:6.1.13'

    implementation 'com.miragesql:miragesql-integration:2.1.2'

    // https://mvnrepository.com/artifact/com.rometools/rome
    implementation 'com.rometools:rome:2.1.0'

    // https://mvnrepository.com/artifact/org.codehaus.jackson/jackson-core-asl
    implementation 'org.codehaus.jackson:jackson-core-asl:1.9.13'

    // https://mvnrepository.com/artifact/com.google.guava/guava
    implementation 'com.google.guava:guava:33.2.1-jre'

    implementation "com.github.node-gradle:gradle-node-plugin:3.1.0"

    // https://mvnrepository.com/artifact/org.jsoup/jsoup
    implementation 'org.jsoup:jsoup:1.17.2'

    // https://mvnrepository.com/artifact/commons-validator/commons-validator
    implementation 'commons-validator:commons-validator:1.7'

    // https://mvnrepository.com/artifact/com.atilika.kuromoji/kuromoji-ipadic
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0-M1'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    testImplementation 'ch.qos.logback:logback-classic:1.5.13'

    implementation 'com.codeborne:selenide:7.3.1'

    // https://mvnrepository.com/artifact/org.mockito/mockito-inline
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // https://mvnrepository.com/artifact/org.apache.lucene/lucene-analyzers-kuromoji
    implementation group: 'org.apache.lucene', name: 'lucene-analyzers-kuromoji', version: lucene_version

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.18.0'

    // https://mvnrepository.com/artifact/org.apache.lucene/lucene-spellchecker
    implementation group: 'org.apache.lucene', name: 'lucene-spellchecker', version: '3.6.2'

    // https://localhost:8080/swagger-ui/index.html
    // https://localhost:8080/v3/api-docs
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: springdocOpenApiVersion

    implementation group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.11'

    // https://mvnrepository.com/artifact/org.apache.httpcomponents/httpclient
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.13'

    implementation group: 'oauth.signpost', name: 'signpost-commonshttp4', version: '1.1'

    implementation group: 'commons-io', name: 'commons-io', version: '2.14.0'

// https://mvnrepository.com/artifact/io.github.cdimascio/dotenv-java
    implementation group: 'io.github.cdimascio', name: 'dotenv-java', version: '2.3.2'

// https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
    implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '5.0.0-alpha.14'

    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'

// https://mvnrepository.com/artifact/com.atilika.kuromoji/kuromoji-core
    implementation group: 'com.atilika.kuromoji', name: 'kuromoji-core', version: '0.9.0'

    // Weka
    implementation 'nz.ac.waikato.cms.weka:weka-dev:3.9.6'

    // Gradle
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'

    // https://mvnrepository.com/artifact/com.atilika.kuromoji/kuromoji-ipadic
    implementation group: 'com.atilika.kuromoji', name: 'kuromoji-ipadic', version: '0.9.0'

    implementation 'org.springframework.boot:spring-boot-starter-aop'

    errorprone "com.uber.nullaway:nullaway:$nullAwayVersion"

    // Optional, some source of nullability annotations.
    // Not required on Android if you use the support
    // library nullability annotations.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    errorprone "com.google.errorprone:error_prone_core:$errorProneVersion"

    // 細かい設定をするためにHttpClient5も依存に追加
    implementation 'org.apache.httpcomponents.client5:httpclient5'

// https://mvnrepository.com/artifact/org.apache.lucene/lucene-core
    implementation("org.apache.lucene:lucene-core:${lucene_version}")

//    implementation 'org.nd4j:nd4j-native-platform:1.0.0-M1.1'

// https://mvnrepository.com/artifact/org.apache.lucene/lucene-queryparser
    implementation("org.apache.lucene:lucene-queryparser:${lucene_version}")

    // https://mvnrepository.com/artifact/com.github.pemistahl/lingua
    implementation("com.github.pemistahl:lingua:1.2.2")

//    // https://mvnrepository.com/artifact/com.microsoft.onnxruntime/onnxruntime
//    implementation("com.microsoft.onnxruntime:onnxruntime:1.17.3")

    // https://mvnrepository.com/artifact/com.google.genai/google-genai
    implementation("com.google.genai:google-genai:1.27.0")

    // https://mvnrepository.com/artifact/io.github.java-diff-utils/java-diff-utils
    implementation 'io.github.java-diff-utils:java-diff-utils:4.16'

    implementation 'org.apache.commons:commons-text:1.14.0'

    // https://mvnrepository.com/artifact/org.eclipse.jgit/org.eclipse.jgit
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.4.0.202509020913-r'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-webflux
    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.5.4'
}

sonarqube {
    properties {
        property "sonar.projectKey", "suzaku-tec_GaleWing"
        property "sonar.organization", "suzaku-tec"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.exclusions", "src/main/java/com/galewings/entity/**, " +
                "src/main/java/com/galewings/exception/**, src/main/java/com/galewings/dto/**, " +
                "src/test/java/**/*Test.java, src/main/java/com/galewings/controller/SiteFeedController.java, " +
                "src/main/java/com/galewings/task/AutoUpdateTask.java, src/main/javascript/src/index.ts, " +
                "src/main/java/com/galewings/controller/FeedSampleController.java, " +
                "src/main/java/com/galewings/GaleWingsApplication.java, " +
                "src/main/java/com/galewings/service/MachineLearningService.java, " +
                "src/main/java/com/galewings/service/PodcastService.java, " +
                "src/main/java/com/galewings/task/**, " +
                "src/main/java/com/galewings/config/**, " +
                "src/main/java/com/galewings/service/GeminiService.java, " +
                "src/main/java/gradle/task/**, " +
                "src/main/java/com/galewings/service/CustomRssService.java, " +
                "src/main/java/com/galewings/util/OllamaClient.java"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'gradle/task/**/*.class'
            ])
        })
    }
}

tasks.register('npmRun', NpmTask) {
    npmCommand = ['run', 'deploy']
    execOverrides {
        // The it variable contains the `ExecSpec`
        it.ignoreExitValue = true
        // We can also omit it since "it" is implicit
        workingDir = file('src/main/javascript')
    }
}


